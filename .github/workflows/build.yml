name: Build & Package Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Extension
    runs-on: ubuntu-latest

    env:
      CHECKMAIL_API_BASE_URL: ${{ vars.CHECKMAIL_API_BASE_URL || 'http://localhost:8080' }}
      CHECKMAIL_API_KEY: ${{ secrets.CHECKMAIL_API_KEY || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

      - name: Build Chrome extension (dist/)
        run: npm run build

      - name: Build Firefox extension (dist-firefox/)
        run: npm run build:firefox

      - name: Package Chrome Extension (.zip)
        run: |
          cd dist && zip -r ../checkmail-extension-chrome.zip ./* && cd ..

      - name: Package Firefox Extension (.zip)
        run: |
          cd dist-firefox && zip -r ../checkmail-extension-firefox.zip ./* && cd ..

      - name: Upload Chrome Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkmail-extension-chrome
          path: checkmail-extension-chrome.zip
          retention-days: 14

      - name: Upload Firefox Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkmail-extension-firefox
          path: checkmail-extension-firefox.zip
          retention-days: 14
