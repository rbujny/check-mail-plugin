      (opts => {
        let extraResizeCheck;

        const getCookie = (name) => {
          const cookieValue = '; ' + document.cookie;
          const cookieParts = cookieValue.split('; ' + name + '=');
          if (cookieParts.length === 2) {
            return cookieParts.pop().split(';').shift();
          }
        }

        const getSurvicateBox = () => document.getElementById('survicate-box');
        const frameElementStyle = frameElement.style;
        const frameRestyleTimeout = (callback) => setTimeout(callback, 300);

        opts.traits = {

          browser: 'Chrome',
          premium: 'false',
        };

        const hideSurvey = () => {
          frameElement.removeAttribute('style');
          clearInterval(extraResizeCheck);
        }

        const showSurvey = () => {
          frameElementStyle.bottom = 0;
          frameElement.classList.add('hideIfSessionReplaced');
        }

        const testSurvey = window.top.location.href.includes('testsurvey');

        const reloadSizes = () => {
          const survicateWrapper = getSurvicateBox()?.firstChild?.firstChild;

          if (!_sva || !survicateWrapper || !survicateWrapper.clientHeight) {
            return;
          }

          if (!survicateWrapper && !testSurvey) {
            return;
          }

          frameElementStyle.height = survicateWrapper.clientHeight + 'px';
          frameElementStyle.width = survicateWrapper.clientWidth + 'px';
        }

        const surveyReady = () => {
          frameRestyleTimeout(() => {
            const minimizedSurveyWrapper = document.querySelector('[aria-label="Minimized Survey"]');

            if (minimizedSurveyWrapper) {
              minimizedSurveyWrapper.childNodes[0].classList.add('minimized-wrapper');
              minimizedSurveyWrapper.childNodes[0].style.height = frameElement.clientHeight + 'px';
              frameRestyleTimeout(showSurvey);
            }
          });

          if (testSurvey) {
            _sva.showSurvey('0d01bf2dd52ea663' || '0d01bf2dd52ea663', {
              forceDisplay: true,
            });
          }

          frameRestyleTimeout(reloadSizes);

          _sva.addEventListener('survey_displayed', surveyId => {
            frameRestyleTimeout(showSurvey);
            frameElementStyle.height = '100%';
            frameElementStyle.width = '100%';
            frameRestyleTimeout(reloadSizes);

            extraResizeCheck = setInterval(reloadSizes, 3000);
          });

          _sva.addEventListener('question_answered', (surveyId, questionId, answer) => {
            hideSurvey();
            frameRestyleTimeout(showSurvey);
            frameRestyleTimeout(reloadSizes);
          });

          _sva.addEventListener('survey_completed', surveyId => {
            hideSurvey();
          });

          _sva.addEventListener('survey_closed', surveyId => {
            hideSurvey();
          });

          const hideFrameIfCleared = ({ disconnect }) => {
            const minimizedSurvey = document.querySelector('[aria-label="Minimized Survey"]');
            const getMinimizedSize = (type) => minimizedSurvey.childNodes[0]['client' + type] + 'px';

            if (!getSurvicateBox().innerHTML.length) {

              disconnect;
            }

            if (minimizedSurvey) {
              frameElementStyle.height = getMinimizedSize('Height');
              frameElementStyle.width = getMinimizedSize('Width');

          }

          boxObserver.observe(getSurvicateBox(), { childList: true });
